# Video understanding eval set (M6-03/M6-04; homehelper_evals.video). Clips live under
# data/media/ and never go into git. Labels need someone who watched *and listened to* the clip:
# set `reviewed: true` once they are checked.
cases:
  - id: home-issue-microwave
    path: home_issue.mp4
    reviewed: true
    notes: >
      A stainless over-the-counter microwave; a finger presses several keypad buttons, then
      Stop/Clear. The display stays dark and nothing responds. Brand isn't legible. Labels
      confirmed by a person who watched and listened to the clip.
    expect:
      category: microwave
      symptom_keywords: [button]
      hazards: []
