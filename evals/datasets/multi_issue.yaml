# Multi-issue set (ADR-007, spec §7.4, §16.3): two problems in one conversation.
# Each case pairs two frozen test-split scenarios by variant id; the scenario text, the fix, the
# model number and the correct manual come from the dataset. The runner brings up the second
# problem once the agent has shown `switch_after_steps` step cards for the first, and returns to
# the first once the second is settled, by `return_via`:
#   card      press "Continue" on the IssuesCard (falls back to naming the appliance)
#   appliance "Now, back to my <appliance> from before."
#   confirm   "Yes, let's go back to the other problem." (a typed confirm)
#   close     press "Close" on the IssuesCard: the first problem must end as abandoned
# Graded per issue (outcome of each, citations from the manual of the issue being discussed),
# plus that the agent offered the paused problem when the second one was settled.
version: 1
cases:
