[project]
name = "homehelper-evals"
version = "0.1.0"
description = "HomeHelper evaluation: retrieval eval, user simulator, graders, runner"
requires-python = ">=3.12,<3.13"
dependencies = ["homehelper"]

[tool.uv.sources]
homehelper = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homehelper_evals"]
