name: homehelper

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: homehelper
      POSTGRES_PASSWORD: homehelper
      POSTGRES_DB: homehelper
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehelper -d homehelper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      target: dev
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://homehelper:homehelper@postgres:5432/homehelper
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - ../apps/api:/app/apps/api
      - ../config:/app/config:ro
      - ../data/mock:/app/data/mock:ro
      - ../data/media/uploads:/app/data/media/uploads  # uploaded photos and videos (git-ignored)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      target: dev
    environment:
      # The browser calls /v1 on the web app, which proxies it to the API (ADR-011).
      API_URL: http://api:8000
    ports: ["3000:3000"]
    volumes:
      - ../apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
