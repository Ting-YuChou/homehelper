<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Helper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            display: flex;
        }

        .sidebar {
            width: 340px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: left 0.3s, width 0.3s;
            z-index: 1500;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversation-item:hover {
            background-color: #f0f2f5;
        }

        .conversation-item.active {
            background-color: #e3f2fd;
        }

        .conversation-item .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background-color: #4a6fa5;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            clear: both;
        }

        .user-message {
            background-color: #dcf8c6;
            float: right;
            border-bottom-right-radius: 5px;
        }

        .agent-message {
            background-color: #ffffff;
            float: left;
            border-bottom-left-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message-content {
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.7em;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .media-preview {
            max-width: 200px;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-input {
            padding: 15px;
            background-color: #f0f2f5;
            border-top: 1px solid #e0e0e0;
        }

        .input-group {
            position: relative;
        }

        #message-input {
            border-radius: 20px;
            padding-right: 100px;
            resize: none;
            overflow: hidden;
            height: 50px;
            max-height: 100px;
        }

        .input-buttons {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }

        .btn-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }

        .media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .media-modal-content {
            max-width: 90%;
            max-height: 90%;
        }

        .media-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .camera-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Prevent default touch actions */
        }

        .camera-inner {
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        #camera-preview {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: cover;
            background-color: #000;
            transform: scaleX(-1); /* Mirror effect for selfie view */
        }

        .camera-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
            background-color: #333;
            flex-wrap: wrap;
            gap: 10px;
            touch-action: manipulation; /* Improve touch response */
        }

        .camera-controls button {
            margin: 0 5px;
            min-width: 44px;
            min-height: 44px; /* Minimum touch target size */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        /* Media preview styles */
        .media-preview-container {
            position: relative;
            display: inline-block;
            margin: 5px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-width: 150px;
            max-height: 150px;
        }

        .media-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }

            .chat-input {
                padding: 10px;
            }

            #message-input {
                height: 40px;
            }

            .btn-circle {
                width: 32px;
                height: 32px;
            }

            .camera-inner {
                max-width: 100%;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            #camera-preview {
                max-height: 60vh;
            }

            .camera-controls {
                padding: 10px 5px;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: rgba(51, 51, 51, 0.9);
            }

            .camera-controls button {
                font-size: 0.9rem;
                padding: 8px 12px;
                margin: 0 4px;
            }

            .media-preview-container {
                max-width: 120px;
                max-height: 120px;
            }
        }

        /* Small mobile devices */
        @media (max-width: 480px) {
            .camera-controls button {
                font-size: 0.8rem;
                padding: 6px 10px;
                margin: 0 2px;
            }

            .camera-controls button i {
                margin-right: 2px;
            }

            #camera-preview {
                max-height: 50vh;
            }

            .media-preview-container {
                max-width: 100px;
                max-height: 100px;
            }
        }

        /* Landscape mode adjustments */
        @media (max-height: 500px) and (orientation: landscape) {
            .camera-inner {
                flex-direction: row;
                align-items: center;
            }

            #camera-preview {
                max-height: 90vh;
                max-width: 60%;
            }

            .camera-controls {
                flex-direction: column;
                width: 40%;
                height: 100%;
                justify-content: center;
            }
        }

        @media (min-width: 992px) {
            .chat-container {
                max-width: 900px;
                margin: 0 auto;
                height: 100vh;
                border-left: 1px solid #e0e0e0;
                border-right: 1px solid #e0e0e0;
            }
        }

        /* Loading indicator */
        .typing-indicator {
            display: none;
            background-color: #f0f2f5;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            float: left;
            clear: both;
            text-align: center;
        }

        .typing-indicator img {
            width: 40px;
            height: 40px;
        }

        .typing-indicator-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        /* Dots animation (fallback if GIF doesn't load) */
        .typing-dots span {
            height: 10px;
            width: 10px;
            background-color: #4a6fa5;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.3s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 991px) {
            .sidebar {
                position: fixed;
                left: -340px;
                top: 0;
                width: 80vw;
                max-width: 340px;
                min-width: 220px;
                height: 100vh;
                box-shadow: 2px 0 10px rgba(0,0,0,0.1);
                transition: left 0.3s;
            }
            .sidebar.sidebar-open {
                left: 0;
            }
            .sidebar-mobile {
                left: -340px;
            }
        }

        #sidebar-hamburger {
            display: none;
        }

        @media (max-width: 991px) {
            #sidebar-hamburger {
                display: block;
            }
        }

        @media (min-width: 992px) {
            .sidebar {
                width: 340px;
                min-width: 300px;
                max-width: 400px;
            }
        }

        .sidebar.sidebar-open {
            left: 0;
        }
        .sidebar-mobile {
            position: fixed;
            left: -340px;
            top: 0;
            width: 80vw;
            max-width: 340px;
            min-width: 220px;
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s;
        }
        .sidebar-wide {
            width: 340px;
            min-width: 300px;
            max-width: 400px;
        }
        #sidebar-hamburger {
            display: block;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Conversations</h3>
            <button id="new-conversation-btn" class="btn btn-primary btn-sm">
                <i class="fas fa-plus"></i> New
            </button>
        </div>
        <div class="conversations-list" id="conversations-list">
            <!-- Conversations will be listed here -->
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Home Helper</h2>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="agent-message message">
                <div class="message-content">
                    Hello! I'm your Home Helper. How can I assist you today?
                </div>
                <div class="message-time">Now</div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="typing-indicator-text">Processing your request...</div>
                <div class="typing-dots" style="display: none;">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <form id="chat-form" enctype="multipart/form-data">
                <div class="input-group">
                    <textarea id="message-input" class="form-control" placeholder="Type a message..." required></textarea>
                    <div class="input-buttons">
                        <button type="button" id="camera-btn" class="btn btn-light btn-circle">
                            <i class="fas fa-camera"></i>
                        </button>
                        <button type="button" id="video-btn" class="btn btn-light btn-circle">
                            <i class="fas fa-video"></i>
                        </button>
                        <button type="button" id="upload-btn" class="btn btn-light btn-circle">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="file-input" style="display: none;" accept="image/*,video/*" multiple>
                        <button type="submit" class="btn btn-primary btn-circle">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Camera container -->
    <div class="camera-container" id="camera-container">
        <div class="camera-inner">
            <video id="camera-preview" autoplay playsinline></video>
            <div class="camera-controls">
                <button id="switch-camera" class="btn btn-light">
                    <i class="fas fa-sync"></i>
                </button>
                <button id="capture-photo" class="btn btn-primary">
                    <i class="fas fa-camera"></i> Photo
                </button>
                <button id="start-video" class="btn btn-danger">
                    <i class="fas fa-video"></i> Record
                </button>
                <button id="stop-video" class="btn btn-danger" style="display: none;">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="close-camera" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
        <canvas id="photo-canvas" style="display: none;"></canvas>
    </div>

    <!-- Media preview modal -->
    <div class="media-modal" id="media-modal">
        <span class="media-modal-close" id="media-modal-close">&times;</span>
        <img class="media-modal-content" id="media-modal-content">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Place this at the very top of your <script> section, before any function or event uses it
        let currentSessionId = null;

        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            // Generate or load persistent session ID
            if (!sessionStorage.getItem("session_id")) {
                sessionStorage.setItem("session_id", crypto.randomUUID());
            }
            const session_id = sessionStorage.getItem("session_id");
            // end of session_id code
            const chatForm = document.getElementById('chat-form');
            const messageInput = document.getElementById('message-input');
            const chatMessages = document.getElementById('chat-messages');
            const fileInput = document.getElementById('file-input');
            const uploadBtn = document.getElementById('upload-btn');
            const cameraBtn = document.getElementById('camera-btn');
            const videoBtn = document.getElementById('video-btn');
            const cameraContainer = document.getElementById('camera-container');
            const cameraPreview = document.getElementById('camera-preview');
            const switchCameraBtn = document.getElementById('switch-camera');
            const capturePhotoBtn = document.getElementById('capture-photo');
            const startVideoBtn = document.getElementById('start-video');
            const stopVideoBtn = document.getElementById('stop-video');
            const closeCameraBtn = document.getElementById('close-camera');
            const photoCanvas = document.getElementById('photo-canvas');
            const mediaModal = document.getElementById('media-modal');
            const mediaModalContent = document.getElementById('media-modal-content');
            const mediaModalClose = document.getElementById('media-modal-close');
            const typingIndicator = document.getElementById('typing-indicator');
            const typingDots = typingIndicator.querySelector('.typing-dots');

            // Media capture variables
            let stream = null;
            let mediaRecorder = null;
            let recordedChunks = [];
            let facingMode = 'user'; // front camera by default

            // Auto-resize textarea
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.scrollHeight > 100) {
                    this.style.height = '100px';
                }
            });
            messageInput.addEventListener('keydown', function(event) {
                // If Enter without Shift
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();  // Prevent newline insertion
                    // Use requestSubmit() if available (validates and triggers submit event)
                    if (typeof chatForm.requestSubmit === 'function') {
                    chatForm.requestSubmit();   // Modern browsers :contentReference[oaicite:11]{index=11}
                    } else {
                    chatForm.submit();         // Fallback (no built-in validation) :contentReference[oaicite:12]{index=12}
                    }
                }
                // If Shift+Enter, let the newline happen naturally
                });


            // Handle file upload button
            uploadBtn.addEventListener('click', function() {
                fileInput.click();
            });

            // Handle camera button
            cameraBtn.addEventListener('click', function() {
                openCamera('photo');
            });

            // Handle video button
            videoBtn.addEventListener('click', function() {
                openCamera('video');
            });

            // Switch camera
            switchCameraBtn.addEventListener('click', function() {
                facingMode = facingMode === 'user' ? 'environment' : 'user';
                stopMediaTracks();
                openCamera(startVideoBtn.style.display === 'none' ? 'video' : 'photo');
            });

            // Capture photo
            capturePhotoBtn.addEventListener('click', capturePhoto);

            // Start video recording
            startVideoBtn.addEventListener('click', startVideoRecording);

            // Stop video recording
            stopVideoBtn.addEventListener('click', stopVideoRecording);

            // Close camera
            closeCameraBtn.addEventListener('click', function() {
                cameraContainer.style.display = 'none';
                stopMediaTracks();
            });

            // Close media modal
            mediaModalClose.addEventListener('click', function() {
                mediaModal.style.display = 'none';
            });

            // Handle file selection
            fileInput.addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    for (let i = 0; i < this.files.length; i++) {
                        const file = this.files[i];
                        // Check file size (limit to 100MB)
                        if (file.size > 100 * 1024 * 1024) {
                            alert('File size exceeds 100MB limit');
                            continue;
                        }
                        previewFile(file);
                    }
                }
            });

            // Load chat history on page load
            loadChatHistory();

            // Handle form submission
            chatForm.addEventListener('submit', 
            async function(e) {
                e.preventDefault();

                const message = messageInput.value.trim();
                if (!message && !fileInput.files.length && !capturedMedia.length) {
                    return;
                }

                // Display user message
                displayUserMessage(message, capturedMedia);

                // Show loading indicator with GIF
                typingIndicator.style.display = 'block';

                // Disable the submit button and input while processing
                const submitButton = chatForm.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                messageInput.disabled = true;

                scrollToBottom();

                try {
                    const formData = new FormData();
                    formData.append('session_id', session_id);
                    formData.append('message', message);

                    // Add files from file input
                    for (let i = 0; i < fileInput.files.length; i++) {
                        formData.append('files', fileInput.files[i]);
                    }

                    // Add captured media
                    for (let i = 0; i < capturedMedia.length; i++) {
                        const media = capturedMedia[i];
                        const blob = await fetch(media.url).then(r => r.blob());
                        formData.append('files', blob, media.filename);
                    }

                    const response = await fetch('/chat', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const data = await response.json();
                        displayAgentMessage(data.text, data.product_links);
                    } else {
                        throw new Error('Failed to send message');
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    displayAgentMessage('Sorry, there was an error processing your request.',"");
                } finally {
                    // Hide loading indicator
                    typingIndicator.style.display = 'none';

                    // Re-enable the submit button and input
                    const submitButton = chatForm.querySelector('button[type="submit"]');
                    submitButton.disabled = false;
                    messageInput.disabled = false;
                }

                // Clear input and reset
                messageInput.value = '';
                messageInput.style.height = '50px';
                fileInput.value = '';

                // Clear captured media
                capturedMedia = [];

                // Clear the media previews container
                const previewsContainer = document.getElementById('media-previews-container');
                if (previewsContainer) {
                    previewsContainer.innerHTML = '';
                }

                // Revoke any object URLs to free memory
                document.querySelectorAll('img.media-preview, video.media-preview').forEach(element => {
                    if (element.src && element.src.startsWith('blob:')) {
                        URL.revokeObjectURL(element.src);
                    }
                });
            }
        );

            // Array to store captured media
            let capturedMedia = [];

            // Function to load chat history
            async function loadChatHistory() {
                try {
                    const response = await fetch(`/chat_history?session_id=${session_id}`);
                    // const response = await fetch('/chat_history');
                    if (response.ok) {
                        const history = await response.json();

                        // Clear existing messages except the welcome message
                        while (chatMessages.children.length > 1) {
                            chatMessages.removeChild(chatMessages.lastChild);
                        }

                        // Display chat history
                        history.forEach(entry => {
                            const userMedia = entry.files.map(file => ({
                                type: file.includes('.jpg') || file.includes('.jpeg') || file.includes('.png') ? 'image' : 'video',
                                url: file
                            }));

                            displayUserMessage(entry.user_message, userMedia);
                            displayAgentMessage(entry.agent_response, entry.product_links);
                        });
                    }
                } catch (error) {
                    console.error('Error loading chat history:', error);
                }
            }

            // Function to open camera
            function openCamera(mode) {
                const constraints = {
                    audio: mode === 'video',
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                // Check if running on mobile device
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                
                if (isMobile) {
                    // Adjust constraints for mobile devices
                    constraints.video = {
                        facingMode: facingMode,
                        width: { ideal: window.innerWidth },
                        height: { ideal: window.innerHeight }
                    };
                }

                navigator.mediaDevices.getUserMedia(constraints)
                    .then(function(mediaStream) {
                        stream = mediaStream;
                        cameraPreview.srcObject = mediaStream;
                        cameraContainer.style.display = 'flex';

                        if (mode === 'video') {
                            startVideoBtn.style.display = 'inline-block';
                            capturePhotoBtn.style.display = 'none';
                        } else {
                            startVideoBtn.style.display = 'inline-block';
                            capturePhotoBtn.style.display = 'inline-block';
                        }

                        stopVideoBtn.style.display = 'none';

                        // Handle orientation changes
                        window.addEventListener('orientationchange', handleOrientationChange);
                        
                        // Ensure the video is properly sized after loading
                        cameraPreview.onloadedmetadata = function() {
                            handleOrientationChange();
                        };
                    })
                    .catch(function(error) {
                        console.error('Error accessing media devices:', error);
                        alert('Unable to access camera. Please check your permissions.');
                    });
            }

            // Add orientation change handler
            function handleOrientationChange() {
                const videoRatio = cameraPreview.videoWidth / cameraPreview.videoHeight;
                const containerRatio = cameraPreview.clientWidth / cameraPreview.clientHeight;
                
                if (videoRatio > containerRatio) {
                    cameraPreview.style.width = '100%';
                    cameraPreview.style.height = 'auto';
                } else {
                    cameraPreview.style.width = 'auto';
                    cameraPreview.style.height = '100%';
                }
            }

            // Function to stop media tracks
            function stopMediaTracks() {
                if (stream) {
                    stream.getTracks().forEach(track => {
                        track.stop();
                    });
                }

                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            }

            // Function to capture photo
            function capturePhoto() {
                const context = photoCanvas.getContext('2d');
                photoCanvas.width = cameraPreview.videoWidth;
                photoCanvas.height = cameraPreview.videoHeight;
                context.drawImage(cameraPreview, 0, 0, photoCanvas.width, photoCanvas.height);

                const imageDataUrl = photoCanvas.toDataURL('image/jpeg');

                // Add to captured media
                capturedMedia.push({
                    type: 'image',
                    url: imageDataUrl,
                    filename: `photo_${Date.now()}.jpg`
                });

                // Preview the captured photo
                previewCapturedMedia(imageDataUrl, 'image');

                // Close camera
                cameraContainer.style.display = 'none';
                stopMediaTracks();
            }

            // Function to start video recording
            function startVideoRecording() {
                recordedChunks = [];
                const options = { mimeType: 'video/webm;codecs=vp9,opus' };

                try {
                    mediaRecorder = new MediaRecorder(stream, options);
                } catch (error) {
                    console.error('MediaRecorder error:', error);
                    try {
                        // Try with a different MIME type
                        mediaRecorder = new MediaRecorder(stream);
                    } catch (e) {
                        alert('Video recording is not supported in this browser.');
                        return;
                    }
                }

                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(blob);

                    // Add to captured media
                    capturedMedia.push({
                        type: 'video',
                        url: videoUrl,
                        filename: `video_${Date.now()}.webm`
                    });

                    // Preview the recorded video
                    previewCapturedMedia(videoUrl, 'video');

                    // Close camera
                    cameraContainer.style.display = 'none';
                    stopMediaTracks();
                };

                mediaRecorder.start();
                startVideoBtn.style.display = 'none';
                stopVideoBtn.style.display = 'inline-block';
            }

            // Function to stop video recording
            function stopVideoRecording() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            }

            // Function to preview file
            function previewFile(file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const fileType = file.type.split('/')[0];

                    // Add to captured media
                    capturedMedia.push({
                        type: fileType,
                        url: e.target.result,
                        filename: file.name
                    });

                    // Preview the file
                    previewCapturedMedia(e.target.result, fileType);
                };

                reader.readAsDataURL(file);
            }

            // Function to preview captured media
            function previewCapturedMedia(url, type) {
                const previewContainer = document.createElement('div');
                previewContainer.className = 'media-preview-container';
                
                if (type === 'image') {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'media-preview';
                    img.onclick = function() {
                        showMediaModal(url);
                    };
                    previewContainer.appendChild(img);
                } else if (type === 'video') {
                    const video = document.createElement('video');
                    video.src = url;
                    video.className = 'media-preview';
                    video.controls = true;
                    video.playsInline = true; // Prevent fullscreen on mobile
                    previewContainer.appendChild(video);
                }

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-sm btn-danger position-absolute top-0 end-0 m-1';
                removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                removeBtn.style.fontSize = '0.7rem';
                removeBtn.style.padding = '2px 5px';
                removeBtn.style.opacity = '0.8';
                removeBtn.onclick = function(e) {
                    e.stopPropagation(); // Prevent event bubbling
                    const index = capturedMedia.findIndex(media => media.url === url);
                    if (index !== -1) {
                        capturedMedia.splice(index, 1);
                    }

                    if (url.startsWith('blob:')) {
                        URL.revokeObjectURL(url);
                    }

                    previewContainer.remove();
                };

                previewContainer.appendChild(removeBtn);

                let previewsContainer = document.getElementById('media-previews-container');
                if (!previewsContainer) {
                    previewsContainer = document.createElement('div');
                    previewsContainer.id = 'media-previews-container';
                    previewsContainer.style.display = 'flex';
                    previewsContainer.style.flexWrap = 'wrap';
                    previewsContainer.style.gap = '5px';
                    previewsContainer.style.marginBottom = '10px';
                    messageInput.parentNode.insertBefore(previewsContainer, messageInput);
                }

                previewsContainer.appendChild(previewContainer);
            }

            // Function to show media modal
            function showMediaModal(src) {
                mediaModalContent.src = src;
                mediaModal.style.display = 'flex';
            }

            // Function to display user message
            function displayUserMessage(message, media = []) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'user-message message';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                // contentDiv.textContent = message;
                // contentDiv.innerHTML = message.replace(/\n/g, "<br>");
                contentDiv.innerText = message;
                messageDiv.appendChild(contentDiv);

                // Add media if any
                if (media.length > 0) {
                    for (const item of media) {
                        if (item.type === 'image') {
                            const img = document.createElement('img');
                            img.src = item.url;
                            img.className = 'media-preview';
                            img.onclick = function() {
                                showMediaModal(item.url);
                            };
                            messageDiv.appendChild(img);
                        } else if (item.type === 'video') {
                            const video = document.createElement('video');
                            video.src = item.url;
                            video.className = 'media-preview';
                            video.controls = true;
                            messageDiv.appendChild(video);
                        }
                    }
                }

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = 'Now';
                messageDiv.appendChild(timeDiv);

                chatMessages.appendChild(messageDiv);
                scrollToBottom();
            }

            // Function to display agent message
            function displayAgentMessage(message, productLinks) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'agent-message message';

                // Always show the main orchestrator message (troubleshooting steps)
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                if (message && message.trim()) {
                    // Show as multi-line (preserve line breaks)
                    contentDiv.innerHTML = message.replace(/\n/g, '<br>');
                } else {
                    contentDiv.textContent = 'No response generated.';
                }
                messageDiv.appendChild(contentDiv);

                // Always show product links button below the main message
                const productLinksBtn = document.createElement('button');
                productLinksBtn.className = 'btn btn-sm btn-primary mt-2';
                productLinksBtn.textContent = 'View Product Links';

                productLinksBtn.onclick = function() {
                    // Remove any existing modal
                    let existingModal = document.getElementById('product-links-modal-overlay');
                    if (existingModal) existingModal.remove();
                    console.log(productLinks);
                    if (!productLinks || typeof productLinks !== 'string' || !productLinks.trim()) {
                        alert('No product links available for this step.');
                        return;
                    }

                    let modalOverlay = document.createElement('div');
                    modalOverlay.id = 'product-links-modal-overlay';
                    modalOverlay.style.position = 'fixed';
                    modalOverlay.style.top = '0';
                    modalOverlay.style.left = '0';
                    modalOverlay.style.width = '100vw';
                    modalOverlay.style.height = '100vh';
                    modalOverlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
                    modalOverlay.style.display = 'flex';
                    modalOverlay.style.justifyContent = 'center';
                    modalOverlay.style.alignItems = 'center';
                    modalOverlay.style.zIndex = '4000';

                    const modalContent = document.createElement('div');
                    modalContent.style.backgroundColor = 'white';
                    modalContent.style.padding = '20px';
                    modalContent.style.borderRadius = '8px';
                    modalContent.style.position = 'relative';
                    modalContent.style.maxWidth = '80%';
                    modalContent.style.maxHeight = '80vh';
                    modalContent.style.overflowY = 'auto';

                    const productLinksContainer = document.createElement('div');
                    productLinksContainer.style.marginBottom = '20px';

                    // Try to parse as JSON first
                    try {
                        const jsonData = JSON.parse(productLinks);
                        if (Array.isArray(jsonData)) {
                            jsonData.forEach(item => {
                                if (item.title && item.url) {
                                    const linkDiv = document.createElement('div');
                                    linkDiv.style.marginBottom = '10px';
                                    
                                    const a = document.createElement('a');
                                    a.href = item.url;
                                    a.target = '_blank';
                                    a.textContent = item.title;
                                    a.style.color = '#007bff';
                                    a.style.textDecoration = 'none';
                                    a.style.fontWeight = 'bold';
                                    
                                    linkDiv.appendChild(a);
                                    
                                    if (item.description) {
                                        const descSpan = document.createElement('span');
                                        descSpan.textContent = ': ' + item.description;
                                        descSpan.style.color = '#666';
                                        linkDiv.appendChild(descSpan);
                                    }
                                    
                                    productLinksContainer.appendChild(linkDiv);
                                }
                            });
                        }
                    } catch (e) {
                        // If not JSON, try to parse as markdown format
                        const lines = productLinks.split('\n');
                        lines.forEach(line => {
                            if (line.trim()) {
                                const linkDiv = document.createElement('div');
                                linkDiv.style.marginBottom = '10px';
                                
                                // Try to extract URL
                                const urlMatch = line.match(/(https?:\/\/[^\s]+)/);
                                if (urlMatch) {
                                    const url = urlMatch[0];
                                    const title = line.split(url)[0].trim();
                                    
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.target = '_blank';
                                    a.textContent = title || url;
                                    a.style.color = '#007bff';
                                    a.style.textDecoration = 'none';
                                    a.style.fontWeight = 'bold';
                                    
                                    linkDiv.appendChild(a);
                                    
                                    // Add description if exists
                                    const desc = line.split(url)[1]?.trim();
                                    if (desc) {
                                        const descSpan = document.createElement('span');
                                        descSpan.textContent = ': ' + desc;
                                        descSpan.style.color = '#666';
                                        linkDiv.appendChild(descSpan);
                                    }
                                    
                                    productLinksContainer.appendChild(linkDiv);
                                } else {
                                    // If no URL found, just display the text
                                    linkDiv.textContent = line;
                                    productLinksContainer.appendChild(linkDiv);
                                }
                            }
                        });
                    }

                    if (productLinksContainer.children.length > 0) {
                        modalContent.appendChild(productLinksContainer);
                    } else {
                        const noProductLinksDiv = document.createElement('div');
                        noProductLinksDiv.className = 'no-product-links-message';
                        noProductLinksDiv.textContent = 'No product links available for this step.';
                        modalContent.appendChild(noProductLinksDiv);
                    }

                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'btn btn-sm btn-danger';
                    closeBtn.textContent = 'Close';
                    closeBtn.style.marginTop = '10px';
                    closeBtn.onclick = function() {
                        modalOverlay.remove();
                    };
                    modalContent.appendChild(closeBtn);
                    modalOverlay.appendChild(modalContent);
                    document.body.appendChild(modalOverlay);
                };
                messageDiv.appendChild(productLinksBtn);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = 'Now';
                messageDiv.appendChild(timeDiv);

                chatMessages.appendChild(messageDiv);
                scrollToBottom();
            }

            // Function to scroll to bottom of chat
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Check if the browser supports the required APIs
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                cameraBtn.disabled = true;
                videoBtn.disabled = true;
                console.warn('Media capture is not supported in this browser');
            }

            // Clean up resources when page is unloaded
            window.addEventListener('beforeunload', function() {
                // Stop any active media streams
                stopMediaTracks();

                // Revoke all blob URLs
                document.querySelectorAll('img.media-preview, video.media-preview').forEach(element => {
                    if (element.src && element.src.startsWith('blob:')) {
                        URL.revokeObjectURL(element.src);
                    }
                });

                // Clear captured media array
                capturedMedia = [];
            });

            // Add new variables for conversation management
            const newConversationBtn = document.getElementById('new-conversation-btn');
            const conversationsList = document.getElementById('conversations-list');

            // Sidebar and hamburger logic
            let sidebar = document.querySelector('.sidebar');
            let hamburgerBtn = null;
            function createHamburger() {
                if (document.getElementById('sidebar-hamburger')) return;
                hamburgerBtn = document.createElement('button');
                hamburgerBtn.id = 'sidebar-hamburger';
                hamburgerBtn.className = 'btn btn-primary';
                hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i>';
                hamburgerBtn.style.position = 'fixed';
                hamburgerBtn.style.top = '15px';
                hamburgerBtn.style.left = '15px';
                hamburgerBtn.style.zIndex = '3000';
                hamburgerBtn.onclick = function() {
                    sidebar.classList.toggle('sidebar-open');
                };
                document.body.appendChild(hamburgerBtn);
            }
            createHamburger();

            function handleSidebarResponsive() {
                if (window.innerWidth < 992) {
                    sidebar.classList.add('sidebar-mobile');
                    sidebar.classList.remove('sidebar-wide');
                } else {
                    sidebar.classList.remove('sidebar-mobile');
                    sidebar.classList.add('sidebar-wide');
                }
            }
            window.addEventListener('resize', handleSidebarResponsive);
            handleSidebarResponsive();

            // Function to load conversations
            async function loadConversations() {
                try {
                    const response = await fetch('/conversations');
                    if (response.ok) {
                        const conversations = await response.json();
                        conversationsList.innerHTML = '';
                        conversations.forEach(conv => {
                            const convItem = document.createElement('div');
                            convItem.className = 'conversation-item';
                            if (conv.session_id === currentSessionId) {
                                convItem.classList.add('active');
                            }
                            const convInfo = document.createElement('div');
                            convInfo.className = 'conversation-info';
                            convInfo.innerHTML = `
                                <div class="conversation-title">${conv.first_message.substring(0, 30)}...</div>
                                <div class="conversation-meta">
                                    <small>${new Date(conv.last_updated).toLocaleString()}</small>
                                    <small>${conv.message_count} messages</small>
                                </div>
                            `;
                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = 'btn btn-sm btn-danger delete-btn';
                            deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                            deleteBtn.onclick = async (e) => {
                                e.stopPropagation();
                                if (confirm('Are you sure you want to delete this conversation?')) {
                                    const response = await fetch(`/conversations/${conv.session_id}`, {
                                        method: 'DELETE'
                                    });
                                    if (response.ok) {
                                        if (conv.session_id === currentSessionId) {
                                            currentSessionId = null;
                                            chatMessages.innerHTML = '';
                                        }
                                        loadConversations();
                                    }
                                }
                            };
                            convItem.appendChild(convInfo);
                            convItem.appendChild(deleteBtn);
                            convItem.onclick = () => {
                                currentSessionId = conv.session_id;
                                sessionStorage.setItem("session_id", conv.session_id);
                                loadChatHistory();
                                loadConversations(); // Refresh to update active state
                                if (window.innerWidth < 992) {
                                    sidebar.classList.remove('sidebar-open');
                                }
                            };
                            conversationsList.appendChild(convItem);
                        });
                    }
                } catch (error) {
                    console.error('Error loading conversations:', error);
                }
            }

            // Handle new conversation button
            newConversationBtn.addEventListener('click', async () => {
                const response = await fetch('/conversations/new', {
                    method: 'POST'
                });
                if (response.ok) {
                    const data = await response.json();
                    currentSessionId = data.session_id;
                    sessionStorage.setItem("session_id", currentSessionId);
                    loadChatHistory();
                    loadConversations();
                }
            });

            // Load conversations on page load
            loadConversations();

            // Update existing loadChatHistory function to use currentSessionId
            async function loadChatHistory() {
                if (!currentSessionId) return;
                try {
                    const response = await fetch(`/chat_history?session_id=${currentSessionId}`);
                    if (response.ok) {
                        const history = await response.json();
                        chatMessages.innerHTML = '';
                        history.forEach(entry => {
                            // entry.files is already an array from backend
                            const userMedia = entry.files.map(file => ({
                                type: file.includes('.jpg') || file.includes('.jpeg') || file.includes('.png') ? 'image' : 'video',
                                url: file
                            }));
                            displayUserMessage(entry.user_message, userMedia);
                            displayAgentMessage(entry.agent_response, entry.product_links);
                        });
                    }
                } catch (error) {
                    console.error('Error loading chat history:', error);
                }
            }
        });

    </script>
</body>
