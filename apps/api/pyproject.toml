[project]
name = "homehelper"
version = "0.1.0"
description = "HomeHelper API: appliance repair support agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langfuse>=5.0.4",
    "litellm>=1.106.2",
    "llama-cloud>=1.0",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-postprocessor-cohere-rerank>=0.10.0",
    "llama-index-vector-stores-postgres>=0.9.0",
    "mcp>=1.30.0,<2",
    "pydantic-settings>=2.16.1",
    "pypdf[crypto]>=6.21.1",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "structlog>=26.1.0",
    "tavily-python>=0.8.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
homehelper = "homehelper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homehelper"]
