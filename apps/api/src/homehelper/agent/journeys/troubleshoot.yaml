# Main troubleshooting flow (spec §7.4). Predicates are registered in agent/engine/predicates.py.
id: troubleshoot
version: 1
goal: The user confirms the problem is fixed, or is safely referred to a professional.
entry_intents: [report_problem, book_technician]  # the guardrail below escalates the latter

slots:
  appliance_category: { type: enum, values: categories, required: true }
  symptom:            { type: text, required: true }
  brand:              { type: text, required: false }
  model_number:       { type: text, required: false, ask_policy: once }  # ask once, never insist
  error_code:         { type: text, required: false }
  # What the user sees on the appliance, to tell its brand's manuals apart without a model
  # number (data/manuals/features.yaml traits, ADR-013).
  trait_type:         { type: text, required: false }
  trait_controls:     { type: text, required: false }
  trait_installation: { type: text, required: false }
  trait_layout:       { type: text, required: false }
  trait_cooking:      { type: text, required: false }
  trait_mounting:     { type: text, required: false }
  trait_brew_type:    { type: text, required: false }
  badge:              { type: text, required: false }  # a series or product-line name

# Evaluated before step transitions on every turn; a hit overrides the step's own transitions.
guardrails:
  - when: hazard_detected              # G-SAFE-01..04, 07 (two-layer detection), 09 (NLU only)
    to: escalate
  - when: max_failed_steps_reached     # G-LOOP-01: 6 plan items (the plan cap) did not help
    to: escalate
  - when: user_requested_technician
    to: escalate

steps:
  - id: gather
    type: collect
    goal: Get the appliance category and the symptom.
    transitions:
      - when: required_slots_filled
        to: confirm_appliance

  - id: confirm_appliance
    type: confirm
    goal: Confirm low-confidence appliance details, such as a photo-recognized model.
    skip_when: no_unconfirmed_low_confidence_slots
    skip_to: diagnose
    transitions:
      - when: user_confirmed
        to: diagnose
      - when: user_denied
        to: gather
      - when: no_unconfirmed_low_confidence_slots   # the user corrected the details instead
        to: diagnose

  - id: diagnose
    type: system
    # Warranty and repair history need an issue linked to a profile appliance; skipped otherwise.
    # Videos only while the exact model is unknown (ADR-013). A diagnosis repeated with a better
    # identification runs only the search and the plan.
    actions: [mcp:user_profile.get_warranty_status, mcp:user_profile.list_repair_history,
              knowledge.search, mcp:tutorials.search_videos, plan.build]
    transitions:
      - when: only_powered_steps_left               # G-SAFE-08: the rest needs the power on
        to: escalate
      - when: plan_exhausted                        # diagnosed again after the last step
        to: escalate
      - when: plan_available
        to: guide
      - when: plan_unavailable                      # nothing relevant, or every item removed
        to: escalate

  - id: guide
    type: guide
    goal: Explain one step at a time and ask whether it helped.
    tools_allowed: [mcp:tutorials.search_videos, mcp:parts_catalog.search_parts]
    transitions:
      - when: user_reports_fixed
        to: resolved
      - when: identification_changed                # a model number or what it looks like
        to: diagnose                                # tried steps stay tried (ADR-013)
      - when: user_reports_not_fixed_and_plan_has_next
        to: guide                                   # re-entry presents the next plan item
      - when: only_powered_steps_left               # G-SAFE-08: the rest needs the power on
        to: escalate
      - when: plan_exhausted
        to: escalate

  - id: resolved
    type: end
    outcome: resolved
    actions: [mcp:user_profile.add_repair_record]

  - id: escalate
    type: handoff
    goal: Explain why professional help is recommended and offer booking options.
    outcome: escalated
    actions: [mcp:service_booking.list_slots]   # code: the profile's ZIP and the category  # read-only tools only
    transitions:
      - when: booking_confirmed   # BookingSlots card action; code then calls service_booking.book
        to: escalated_end
      - when: identification_changed_after_no_plan  # the model's own manual may cover it
        to: diagnose

  - id: escalated_end
    type: end
    outcome: escalated
    actions: [mcp:service_booking.book]
