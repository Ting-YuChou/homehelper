# Task → model mapping (docs/SPEC.md §9.1). A release manifest may override `model`/`fallbacks` per task.
# Model ids use LiteLLM's "<provider>/<model>" form. Fallbacks whose provider has no API key are skipped.
# Claude tasks fall back to the same model on OpenRouter first (another account, same behavior; its ids
# use dots), then to OpenAI.
# `opencode_go/<openai|anthropic>/<model>` (OpenCode Go subscription) is for eval-experiment
# overrides only; never use it as a default here.
tasks:
  nlu:
    model: anthropic/claude-haiku-5-5
    fallbacks: [openrouter/anthropic/claude-haiku-5.5, openai/gpt-5.4-mini]
    timeout_s: 20
    max_tokens: 1024
  planner:
    model: anthropic/claude-sonnet-5-5
    fallbacks: [openrouter/anthropic/claude-sonnet-5.5, openai/gpt-5.5]
    timeout_s: 45
    max_tokens: 4096
  responder:
    model: anthropic/claude-sonnet-5-5
    fallbacks: [openrouter/anthropic/claude-sonnet-5.5, openai/gpt-5.5]
    timeout_s: 45
    max_tokens: 2048
  supervisor:
    model: anthropic/claude-haiku-5-5
    fallbacks: [openrouter/anthropic/claude-haiku-5.5, openai/gpt-5.4-mini]
    timeout_s: 20
    max_tokens: 1024
  extract:
    # Tool-less structured extraction (manual metadata, untrusted web content).
    model: anthropic/claude-haiku-5-5
    fallbacks: [openrouter/anthropic/claude-haiku-5.5, openai/gpt-5.4-mini]
    timeout_s: 30
    max_tokens: 2048
  vision:
    # Photos → VisionResult (spec §11.2); one call per message with all its photos.
    model: anthropic/claude-haiku-5-5
    fallbacks: [openrouter/anthropic/claude-haiku-5.5, openai/gpt-5.4-mini]
    timeout_s: 45
    max_tokens: 1024
  video:
    # Videos → VideoResult through the Gemini Files API (spec §11.3; media/gemini.py, not
    # LiteLLM). timeout_s is the whole budget: upload, processing and the answer.
    model: gemini/gemini-3.8-flash
    timeout_s: 60
    max_tokens: 1024
  user_simulator:
    model: anthropic/claude-haiku-5-5
    fallbacks: [openrouter/anthropic/claude-haiku-5.5]
    timeout_s: 30
    max_tokens: 1024
  judge:
    model: anthropic/claude-sonnet-5-5
    fallbacks: [openrouter/anthropic/claude-sonnet-5.5]
    timeout_s: 60
    max_tokens: 2048

embedding:
  model: openai/text-embedding-3-small
  dimensions: 1536

rerank:
  model: cohere/rerank-v5.0-fast
