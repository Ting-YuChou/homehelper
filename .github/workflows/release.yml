name: Release

# Release gate (spec §17.3, §18.4, M7-03): run the pre-release eval suites for one release id,
# draft `releases/<id>.yaml` from their reports and block the release if any gate fails.
#
# NOT RUNNABLE YET: the eval suites need a Postgres with an ingested knowledge base and the LLM
# provider keys. Both arrive with the M8 infrastructure (Cloud SQL + Workload Identity
# Federation); until then the `RELEASE_DATABASE_URL` secret does not exist and the evals fail.
#
# Deploying the evaluated image digest (Cloud Run `--image <digest>` with RELEASE_ID=<id>) and
# committing the manifest are left to M8-02.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id, e.g. r2026.11.01-1"
        required: true
        type: string
      resolution_rate_min:
        description: "Minimum resolution rate on the full suite (M2 baseline: 0.578)"
        required: true
        default: "0.58"
        type: string
      kb_version:
        description: "kb_YYYYMMDD_NN to evaluate and pin in the manifest"
        required: true
        type: string
      agent:
        description: "Agent builder passed to `evals run --agent`"
        required: true
        # Switch to the journey agent's builder once M3 lands on main.
        default: "homehelper_evals.builders:baseline"
        type: string
      models:
        description: "Optional repo path of a task -> model overrides YAML (evals --models)"
        required: false
        type: string

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Inputs go through env vars, never straight into shell scripts.
      RELEASE_ID: ${{ inputs.release_id }}
      RESOLUTION_RATE_MIN: ${{ inputs.resolution_rate_min }}
      KB_VERSION: ${{ inputs.kb_version }}
      AGENT: ${{ inputs.agent }}
      MODELS: ${{ inputs.models }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      # A database holding the knowledge base (M8 infra; see the note at the top).
      DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
      # NLTK (via LlamaIndex) refuses hardlinked data files; uv hardlinks from its cache by default.
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen

      - name: Validate inputs
        run: |
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "invalid release id"; exit 1; }
          [[ "$KB_VERSION" =~ ^kb_[0-9]{8}_[0-9]{2}$ ]] || { echo "invalid kb_version"; exit 1; }
          if [[ -e "releases/$RELEASE_ID.yaml" ]]; then echo "release $RELEASE_ID already exists"; exit 1; fi

      - name: Eval suites (safety, full)
        run: |
          set -euo pipefail
          models_arg=()
          if [[ -n "$MODELS" ]]; then models_arg=(--models "$MODELS"); fi
          for suite in safety full; do
            uv run evals run --suite "$suite" --release "$RELEASE_ID" --agent "$AGENT" \
              "${models_arg[@]}"
          done

      - name: Draft the release manifest
        run: |
          set -euo pipefail
          report() { ls -t evals/reports/"${RELEASE_ID}_$1"_*.json | head -n 1; }
          uv run homehelper release draft --id "$RELEASE_ID" --kb-version "$KB_VERSION" \
            --report "safety=$(report safety)" --report "full=$(report full)" \
            --gate "resolution_rate_min=$RESOLUTION_RATE_MIN"

      - name: Check gates
        run: uv run homehelper release check "releases/$RELEASE_ID.yaml"

      - name: Upload the manifest and eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.release_id }}
          path: |
            releases/${{ inputs.release_id }}.yaml
            evals/reports/${{ inputs.release_id }}_*
          if-no-files-found: warn
